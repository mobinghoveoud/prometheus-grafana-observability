global:
  smtp_smarthost: 'mailhog:1025'
  smtp_from: 'alertmanager@example.com'
  smtp_require_tls: false

route:
  receiver: 'mailhog-email'
  group_wait: 30s
  group_interval: 30s
  repeat_interval: 30s
  group_by: ['instance', 'severity']

receivers:
  - name: 'mailhog-email'
    email_configs:
      - to: 'test@example.com'
        send_resolved: true